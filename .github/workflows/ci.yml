name: CI

# PR 和 main 分支 push 时跑：类型检查 + lint + 单测 + 构建。
# 构建只编译不打包（避免发版流程干扰 PR 状态）。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: typecheck + lint + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    name: build (no package)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
