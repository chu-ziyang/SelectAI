name: Release

# 触发条件：推送形如 v1.0.0 的 tag 时自动运行
on:
  push:
    tags:
      - 'v*'

# 权限：让 Action 可以创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 设置 Python (node-gyp 需要)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建并发布 (创建正式 Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # 从 CHANGELOG.md 抽取 ## [VERSION] 段作为 release notes
          NOTES=$(awk "/^## \\[$VERSION\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}。完整变更记录见 CHANGELOG.md。"
          fi
          # 写到 GH_RELEASE_BODY 环境变量，electron-builder 会读取
          export GH_RELEASE_BODY="$NOTES"
          echo "release notes: $(printf '%s' "$NOTES" | wc -c) bytes"
          npm run package -- --publish always

      - name: 上传构建产物 (作为 workflow artifact 备份)
        uses: actions/upload-artifact@v4
        with:
          name: selectai-installer
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 30
