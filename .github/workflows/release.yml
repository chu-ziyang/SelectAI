name: Release

# 触发条件：推送形如 v1.0.0 的 tag 时自动运行
on:
  push:
    tags:
      - 'v*'

# 权限：让 Action 可以创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 设置 Python (node-gyp 需要)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # electron-builder --publish always 会自动创建一个 draft Release，
      # 由维护者登录后在 https://github.com/chu-ziyang/SelectAI/releases
      # 手动点 Publish 完成发布（v1.1.0 时期的发布流程）。
      - name: 构建并创建草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package -- --publish always

      - name: 上传构建产物 (作为 workflow artifact 备份)
        uses: actions/upload-artifact@v4
        with:
          name: selectai-installer
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 30
