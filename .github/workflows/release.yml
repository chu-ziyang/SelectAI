name: Release

# 触发条件：推送形如 v1.0.0 的 tag 时自动运行
on:
  push:
    tags:
      - 'v*'

# 权限：让 Action 可以创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 设置 Python (node-gyp 需要)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # electron-builder 不会把已存在的 draft release 改成 published release。
      # 重跑前如果 draft 还在，先删掉，让 electron-builder 重新创建一个带 notes 的正式 release。
      - name: 清理上次遗留的 draft Release (如果存在)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REL_JSON=$(curl -sS \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${TAG}")
          echo "GET release response (first 200 chars):"
          printf '%s' "$REL_JSON" | head -c 200
          echo ""
          REL_ID=$(printf '%s' "$REL_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const r=JSON.parse(d);process.stdout.write(String(r.id||''))}catch{process.stdout.write('')}})")
          REL_DRAFT=$(printf '%s' "$REL_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const r=JSON.parse(d);process.stdout.write(String(r.draft))}catch{process.stdout.write('')}})")
          echo "REL_ID='${REL_ID}' REL_DRAFT='${REL_DRAFT}'"
          if [ -n "$REL_ID" ] && [ "$REL_DRAFT" = "true" ]; then
            echo "Deleting existing draft release id=${REL_ID} for ${TAG}"
            HTTP_CODE=$(curl -sS -o /tmp/del.json -w "%{http_code}" -X DELETE \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}")
            echo "DELETE http_code=${HTTP_CODE}"
            cat /tmp/del.json | head -c 200
            echo ""
          else
            echo "No draft release to delete; skipping."
          fi

      - name: 构建并发布 (创建正式 Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \\[$VERSION\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}。完整变更记录见 CHANGELOG.md。"
          fi
          export GH_RELEASE_BODY="$NOTES"
          echo "release notes: $(printf '%s' "$NOTES" | wc -c) bytes"
          npm run package -- --publish always
          # electron-builder --publish always 用 releaseType=release 直接发布正式 release；
          # 如果因为 draft 已存在（清理失败等原因）仍然是 draft，这里再强制转一次。
          sleep 3
          REL_JSON=$(curl -sS \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${TAG}")
          REL_DRAFT=$(printf '%s' "$REL_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const r=JSON.parse(d);process.stdout.write(String(r.draft))}catch{process.stdout.write('')}})")
          if [ "$REL_DRAFT" = "true" ]; then
            echo "::warning::Release is still draft after electron-builder; forcing published."
            REL_ID=$(printf '%s' "$REL_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const r=JSON.parse(d);process.stdout.write(String(r.id||''))}catch{process.stdout.write('')}})")
            BODY=$(jq -n --arg n "$NOTES" '{draft: false, body: $n}')
            HTTP_CODE=$(curl -sS -o /tmp/patch.json -w "%{http_code}" -X PATCH \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" \
              -d "$BODY")
            echo "PATCH http_code=${HTTP_CODE}"
            cat /tmp/patch.json | head -c 300
            echo ""
          else
            echo "Release is already published (draft=${REL_DRAFT})."
          fi

      - name: 上传构建产物 (作为 workflow artifact 备份)
        uses: actions/upload-artifact@v4
        with:
          name: selectai-installer
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 30
