name: Release

# 触发条件：推送形如 v1.0.0 的 tag 时自动运行
on:
  push:
    tags:
      - 'v*'

# 权限：让 Action 可以创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 设置 Python (node-gyp 需要)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建并发布 (创建草稿 Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package -- --publish always

      # electron-builder --publish always 只创建草稿 Release。
      # 这里把它转成正式 Release，并把 CHANGELOG 里对应版本的段填进 release notes。
      - name: 发布 Release (草稿 -> 正式)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # 从 CHANGELOG.md 抽取 ## [VERSION] 段
          NOTES=$(awk "/^## \\[$VERSION\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}。完整变更记录见 CHANGELOG.md。"
          fi
          gh release edit "$TAG" --draft=false --notes "$NOTES"
          echo "::notice::Release ${TAG} published with $(echo "$NOTES" | wc -l) lines of notes."

      - name: 上传构建产物 (作为 workflow artifact 备份)
        uses: actions/upload-artifact@v4
        with:
          name: selectai-installer
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 30
